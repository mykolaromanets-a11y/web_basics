<!DOCTYPE html>
<html>
  <head>
    <title>JavaScript Sandbox</title>
    <meta charset="UTF-8" />
  </head>

  <body>
    <h1>Моя перша HTML-форма</h1>
    <form action="https://httpbin.org/get" method="GET">
      <p>
        <label for="name">Імя:</label>
        <input type="text" id="name" name="name" />
      </p>
      <p>
        <label
          >Дата народження:
          <input type="date" name="birthday" />
        </label>
      </p>
      <p>
        <label for="email">Імейл:</label>
        <input type="email" id="email" name="email" />
      </p>
      <p>
        <label for="message">Повідомлення:</label>
        <textarea id="message" name="message"></textarea>
      </p>
      <p>Ваші улюблені напої?</p>
      <label><input type="checkbox" name="drinks" value="coffee" /> Кава</label>
      <label><input type="checkbox" name="drinks" value="tea" /> Чай</label>
      <label><input type="checkbox" name="drinks" value="juice" /> Сік</label>
      <label><input type="checkbox" name="drinks" value="water" /> Вода</label>

      <p>Моя національність</p>
      <label
        ><input type="radio" name="nationality" value="ukrainian" />
        Українець</label
      >
      <label
        ><input type="radio" name="nationality" value="hungarian" />
        Угорець</label
      >
      <label
        ><input type="radio" name="nationality" value="slovak" /> Словак</label
      >
      <p>
        <button type="submit">Надіслати</button>
        <button type="reset">Очистити</button>
      </p>
    </form>
    <picture>
      <source
        media="(max-width: 467px)"
        srcset="https://picsum.photos/300/500"
      />
      <img
        src="https://picsum.photos/1000/400"
        alt="Демонстраційне зображення"
      />
    </picture>

    <script src="./index.mjs" type="module"></script>
  </body>
</html>
